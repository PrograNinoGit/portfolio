<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Agar.io 3D" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="disc"><circle cx="64" cy="64" r="62"/></clipPath>
    <radialGradient id="bg" cx="50%" cy="35%" r="75%">
      <stop offset="0" stop-color="#1f2528"/>
      <stop offset="1" stop-color="#0d0f0e"/>
    </radialGradient>
    <linearGradient id="gridFade" gradientUnits="userSpaceOnUse" x1="0" y1="52" x2="0" y2="128">
      <stop offset="0" stop-color="#9fb88a" stop-opacity="0"/>
      <stop offset="1" stop-color="#9fb88a" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="sphere" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ffc2e0"/>
      <stop offset="0.4" stop-color="#ff4fa3"/>
      <stop offset="1" stop-color="#8c1456"/>
    </radialGradient>
    <radialGradient id="small" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#e6ffb0"/>
      <stop offset="0.5" stop-color="#9be04a"/>
      <stop offset="1" stop-color="#4c7a1c"/>
    </radialGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#000" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#disc)">
    <circle cx="64" cy="64" r="62" fill="url(#bg)"/>

    <!-- perspektivischer Boden: Fluchtpunkt bei (64,52) -->
    <g stroke="url(#gridFade)" stroke-width="1.4" fill="none">
      <line x1="64" y1="52" x2="-60" y2="128"/>
      <line x1="64" y1="52" x2="-12" y2="128"/>
      <line x1="64" y1="52" x2="28" y2="128"/>
      <line x1="64" y1="52" x2="64" y2="128"/>
      <line x1="64" y1="52" x2="100" y2="128"/>
      <line x1="64" y1="52" x2="140" y2="128"/>
      <line x1="64" y1="52" x2="188" y2="128"/>
      <line x1="0" y1="64" x2="128" y2="64"/>
      <line x1="0" y1="75" x2="128" y2="75"/>
      <line x1="0" y1="90" x2="128" y2="90"/>
      <line x1="0" y1="110" x2="128" y2="110"/>
    </g>

    <!-- Schatten -->
    <ellipse cx="72" cy="98" rx="30" ry="8" fill="url(#shadow)"/>
    <ellipse cx="102" cy="100" rx="11" ry="3.5" fill="url(#shadow)"/>

    <!-- große Kugel -->
    <circle cx="62" cy="64" r="28" fill="url(#sphere)"/>
    <ellipse cx="52" cy="52" rx="8" ry="5" fill="#fff" opacity="0.35" transform="rotate(-30 52 52)"/>

    <!-- kleine Kugel -->
    <circle cx="98" cy="86" r="9" fill="url(#small)"/>
    <ellipse cx="95" cy="83" rx="3" ry="2" fill="#fff" opacity="0.4" transform="rotate(-30 95 83)"/>
  </g>

  <circle cx="64" cy="64" r="62" fill="none" stroke="#2c3236" stroke-width="2"/>
</svg>
